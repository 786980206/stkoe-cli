[project]
name = "stkoe"
version = "0.4.0"
description = "stkoe 数据服务（gRPC）"
readme = "README.md"
authors = [
    { name = "刘丰铭", email = "liufengming@pystandard.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.83.0",
    "orjson>=3.11.9",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
]

[project.scripts]
stkoe = "stkoe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=9.1.1",
]
