[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stkoe"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    # --- Portal / UI ---
    "panel>=1.9.3",
    "panel-material-ui>=0.9.1",
    "panel-splitjs>=0.4.0",
    "panel-graphic-walker>=0.6.5",
    "python-frontmatter>=1.1.0",
    "jinja2",
    # --- Data processing ---
    "polars>=1.36.1",
    "polars-ds>=0.10.4",
    "polars-ols>=0.3.5",
    "finance-calcs>=0.2.0",
    "factorium>=0.4.0",
    "polynx>=0.1.15",
    "numpy>=2",
    # --- Visualization ---
    "holoviews>=1.22.1",
    "hvplot>=0.12.2",
    # --- Utilities ---
    "orjson",
    "pandas>=2",
    "typer>=0.12.0",
    "prompt_toolkit>=3.0",
    "pyarrow>=22.0.0",
    "loguru>=0.7.3",
    "grpcio>=1.83.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.pip]
index-url = "https://pypi.doubanio.com/simple"
